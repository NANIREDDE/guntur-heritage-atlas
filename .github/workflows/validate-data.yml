name: Validate atlas data

on:
  push:
    branches: [main, build/atlas-next, 'build/**']
  pull_request:
    branches: [main, build/atlas-next]

jobs:
  data-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate research JSON
        run: python scripts/validate_data.py
